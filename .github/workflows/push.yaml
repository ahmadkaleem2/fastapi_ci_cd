name: Workflow A

on:
  push:
    branches:
      - main

jobs:
  trigger-b:
    runs-on: ubuntu-latest
    # permissions:
      # actions: write   # 👈 REQUIRED
    steps:
      - name: Trigger Workflow B
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/workflow-dispatch.yaml/dispatches \
            -d '{
              "ref": "main"
            }'