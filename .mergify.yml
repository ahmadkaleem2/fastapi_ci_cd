queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - head=test-branch
      - "#approved-reviews-by>=1"
      - check-success=ci
      - schedule=Mon-Fri 21:45-22:00[Asia/Karachi]
    merge_method: merge

pull_request_rules:
  - name: Queue test-branch into main during the deploy window
    conditions:
      - base=main
      - head=test-branch
    actions:
      queue:
